<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Идём! — куда пойти с детьми</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color:#F6F9FF;">

  <!-- ЭКРАН 1: HERO -->
  <section class="min-h-screen flex flex-col items-center justify-center px-6 py-12 text-center">

    <img src="Logo.png" alt="Идём!" class="w-28 h-28 mb-6">

    <h1 class="text-3xl md:text-5xl font-bold leading-tight" style="color:#2E2E2E;">
      Куда пойти с ребёнком<br>прямо сейчас?
    </h1>

    <p class="text-gray-500 mt-4 max-w-md text-base md:text-lg">
      Проверенные места рядом с вами — с пандусом, тихим часом или розеткой для подростка. Без лишней тревоги и долгих поисков.
    </p>

    <button class="mt-8 px-8 py-4 rounded-2xl text-white font-semibold text-lg shadow-lg"
            style="background-color:#FF6B4A;">
      Хочу попробовать
    </button>

  </section>

</body>
</html>
